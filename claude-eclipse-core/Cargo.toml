[package]
name = "claude-eclipse-core"
version = "3.2.27"
edition = "2021"

[lib]
name = "claude_eclipse_core"
crate-type = ["cdylib"]

[dependencies]
jni            = "0.21"
tokio          = { version = "1", features = ["full"] }
axum           = "0.8"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
uuid           = { version = "1", features = ["v4"] }
tokio-stream   = { version = "0.1", features = ["sync"] }
futures-util   = "0.3"
portable-pty   = "0.9"
base64         = "0.23"
# Opens the sealed browser instruction (src/chrome.rs). Already built on every
# target for rustls, so it adds no compile step.
ring           = "0.17"
vt100          = "0.18"
ureq           = { version = "3", features = ["json"] }
qrcode = { version = "0.14.1", default-features = false }
# The composer's @-mention file list: ripgrep's own gitignore-aware walker.
ignore          = "0.4"

# Dictation. Capture is native (cpal) and transcription is Anthropic's own
# streaming service, reached over a WebSocket from Rust -- NOT from the webview.
# Two reasons it lives here rather than in JS: the OAuth bearer token must never
# enter the browser's JS context (the GUI renders model output as HTML), and
# native capture sidesteps WebView2/WebKitGTK getUserMedia permission plumbing
# entirely.
#
# All pure Rust: the nine-target build has no C++ cross-toolchain.
rubato          = "5.0"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

# Capture. Windows and macOS go through cpal, whose audio frameworks ship with the
# OS. Linux and FreeBSD do NOT: cpal links libasound, which makes libasound.so.2 a
# hard load-time dependency of this whole library, so a machine without ALSA could
# not load the plugin at all. There, ALSA is opened at runtime instead (see
# src/alsa_capture.rs) and dictation reports itself unavailable when it is missing.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
cpal            = "0.18"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
libloading      = "0.9"
# Dialogs outside SWT's reach (src/dialogs.rs) are read over the accessibility bus,
# which is D-Bus. Pure Rust, so it adds no load-time library and no C toolchain; on
# tokio, which is already here, rather than its default second async runtime.
zbus            = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }

[lints.clippy]
# The standard module layout (the Rust Book's idiomatic paths): src/<module>.rs next
# to src/<module>/, never src/<module>/mod.rs.
mod_module_files = "deny"

[dev-dependencies]
tempfile = "3.27.0"
