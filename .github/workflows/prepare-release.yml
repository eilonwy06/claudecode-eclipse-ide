name: Prepare release

# Bumps the version number everywhere it's recorded and inserts the given
# changelog entry, then opens a PR against dev for the maintainer to
# review -- exactly like any other change, so the version bump rides along
# whenever dev next gets promoted to master. Nothing publishes on its own:
# merging this PR just updates dev; deploy.yml is still a separate,
# manually-triggered step against whatever commit ends up on master once
# it's promoted, and tag-release.yml only fires on master too, since
# that's when the version is actually live, not merely merged into dev.
#
# workflow_dispatch's own form renders text inputs as single-line, so a
# multi-line changelog body is easiest to supply via the CLI, e.g.:
#   gh workflow run prepare-release.yml -f version=3.2.7 \
#     -f changelog_body="$(cat notes.md)"
on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version number, e.g. 3.2.7"
        required: true
      changelog_body:
        description: "Changelog entry body (markdown, e.g. '### Fixed\n- ...')"
        required: true
  # Deletes the release/* branch this workflow created, once its PR merges
  # -- not relying on the repo-wide "auto delete head branches" setting,
  # so this is self-contained regardless of that setting.
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev

      - name: Bump version numbers
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          OLD=$(grep -oE 'Bundle-Version: [0-9]+\.[0-9]+\.[0-9]+' com.anthropic.claudecode.eclipse/META-INF/MANIFEST.MF | cut -d' ' -f2)
          echo "Bumping $OLD -> $VERSION"

          # .qualifier/-SNAPSHOT suffixes stay as-is -- Tycho substitutes a
          # real qualifier at build time (see deploy.yml), source control
          # only tracks the version number itself.
          sed -i "s/Bundle-Version: ${OLD}\.qualifier/Bundle-Version: ${VERSION}.qualifier/" \
            com.anthropic.claudecode.eclipse/META-INF/MANIFEST.MF
          sed -i "s/version=\"${OLD}\.qualifier\"/version=\"${VERSION}.qualifier\"/" \
            com.anthropic.claudecode.eclipse.feature/feature.xml
          sed -i "s/${OLD}/${VERSION}/g" com.anthropic.claudecode.eclipse.site/site.xml
          sed -i "s/<version>${OLD}-SNAPSHOT<\/version>/<version>${VERSION}-SNAPSHOT<\/version>/" \
            pom.xml \
            com.anthropic.claudecode.eclipse/pom.xml \
            com.anthropic.claudecode.eclipse.feature/pom.xml \
            com.anthropic.claudecode.eclipse.site/pom.xml \
            claude-eclipse-core/pom.xml

          # The native library's own version: Cargo.toml's package version and the
          # matching Cargo.lock entry (CI builds with --locked, so the two must
          # agree). The grep fails the job if either line has drifted from the
          # old version, rather than releasing a library that reports a stale one.
          sed -i "0,/^version = \"${OLD}\"/s//version = \"${VERSION}\"/" claude-eclipse-core/Cargo.toml
          sed -i "/^name = \"claude-eclipse-core\"\$/{n;s/^version = \".*\"/version = \"${VERSION}\"/}" \
            claude-eclipse-core/Cargo.lock
          grep -qxF "version = \"${VERSION}\"" claude-eclipse-core/Cargo.toml
          grep -A1 -xF 'name = "claude-eclipse-core"' claude-eclipse-core/Cargo.lock | grep -qxF "version = \"${VERSION}\""

          # The version banner the plugin itself prints on startup -- every
          # past manual release commit has bumped this same line by hand
          # (grep the source for other hardcoded "(Unofficial) v" strings if
          # this ever needs revisiting). sed exits 0 when nothing matches, so
          # the grep fails the job if the banner wording has drifted from
          # this pattern instead of releasing with the old version on it.
          sed -i "s/Claude Code for Eclipse IDE (Unofficial) v${OLD}/Claude Code for Eclipse IDE (Unofficial) v${VERSION}/" \
            com.anthropic.claudecode.eclipse/src/com/anthropic/claudecode/eclipse/ui/ClaudeCodeView.java
          grep -qF "Claude Code for Eclipse IDE (Unofficial) v${VERSION}" \
            com.anthropic.claudecode.eclipse/src/com/anthropic/claudecode/eclipse/ui/ClaudeCodeView.java

      - name: Insert changelog entry
        env:
          VERSION: ${{ inputs.version }}
          BODY: ${{ inputs.changelog_body }}
        run: |
          python3 - <<'PYEOF'
          import datetime
          import os

          version = os.environ["VERSION"]
          # The Run workflow form only takes one line, so line breaks are
          # typed as a literal \n; turn them back into real newlines.
          body = os.environ["BODY"].replace("\\n", "\n").strip()
          today = datetime.date.today().isoformat()

          # The PR body gets the same converted text.
          with open(os.path.join(os.environ["RUNNER_TEMP"], "release-pr-body.md"), "w") as f:
              f.write(f"Version bump and changelog entry for v{version}, "
                      f"prepared via workflow_dispatch.\n\n{body}\n")

          with open("CHANGELOG.md") as f:
              content = f.read()

          # The previous top entry stops being "current".
          content = content.replace(" *(current)*", "", 1)

          # Insert right after the existing leading "---\n\n" rather than
          # consuming it, so that divider (between the intro paragraph and
          # the entry list) stays put instead of being replaced by this
          # entry's own trailing "---\n\n" (which separates it from the old
          # top entry, now pushed down to second place).
          entry = f"## [{version}] — {today} *(current)*\n\n{body}\n\n---\n\n"
          marker = "---\n\n## ["
          insert_at = content.index(marker) + len("---\n\n")
          content = content[:insert_at] + entry + content[insert_at:]

          with open("CHANGELOG.md", "w") as f:
              f.write(content)
          PYEOF

      - name: Open release PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          BRANCH="release/${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Release v${VERSION}"
          git push origin "$BRANCH"
          gh pr create \
            --base dev \
            --head "$BRANCH" \
            --title "Release v${VERSION}" \
            --body-file "$RUNNER_TEMP/release-pr-body.md"

  delete-release-branch:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Delete the release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${{ github.event.pull_request.head.ref }}"
