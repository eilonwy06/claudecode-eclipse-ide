name: Bug report
description: Report a problem with the plugin
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If this is a **security vulnerability**, please use [private vulnerability reporting](https://github.com/eilonwy06/claudecode-eclipse-ide/security/advisories/new) instead of a public issue.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Help → About Eclipse IDE → Installation Details → Installed Software
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Eclipse version and OS
      placeholder: e.g. Eclipse 2026-06, macOS 15
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Window → Show View → General → Error Log, or console output
      render: shell
